<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Day Booking</title>
  <style>
    :root {
      --bg: #f6f7f4; --ink: #1c2420; --muted: #5d6a63;
      --pitch: #1f6b45; --line: #d9ded8; --error: #b3321f; --info: #2d5f8a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
    main { max-width: 680px; margin: 0 auto; padding: 2rem 1.25rem 6rem; }
    h1, h2 { line-height: 1.2; }
    section { margin-bottom: 4rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .75rem .5rem; border-bottom: 1px solid var(--line); }
    button, input, select { font: inherit; }
    .book-btn, .submit-btn {
      background: var(--pitch); color: #fff; border: 0; border-radius: 4px;
      padding: .5rem 1rem; cursor: pointer;
    }
    .book-btn:hover, .submit-btn:hover { background: #17533a; }
    :focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
    form { display: grid; gap: 1rem; max-width: 420px; scroll-margin-top: 1rem; }
    label { display: grid; gap: .25rem; color: var(--muted); }
    input, select { padding: .5rem; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); }

    /* Toast */
    #toast-container { position: fixed; bottom: 1.25rem; right: 1.25rem; display: grid; gap: .5rem; z-index: 100; }
    .toast {
      background: var(--pitch); color: #fff; padding: .75rem 1rem; border-radius: 4px;
      max-width: 320px; opacity: 0; transform: translateY(12px);
      transition: opacity .25s, transform .25s;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast-error { background: var(--error); }
    .toast-info { background: var(--info); }
    @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Match Day Booking</h1>

    <section id="schedule">
      <h2>Match schedule</h2>
      <table>
        <thead><tr><th>Match</th><th>Date</th><th></th></tr></thead>
        <tbody>
          <tr><td>Hawks vs Tigers</td><td>Sat 22 Nov</td><td><button class="book-btn" data-match="Hawks vs Tigers">Book</button></td></tr>
          <tr><td>Lions vs Wolves</td><td>Sat 29 Nov</td><td><button class="book-btn" data-match="Lions vs Wolves">Book</button></td></tr>
          <tr><td>Eagles vs Bulls</td><td>Sat 6 Dec</td><td><button class="book-btn" data-match="Eagles vs Bulls">Book</button></td></tr>
        </tbody>
      </table>
    </section>

    <!-- Extra height so the smooth scroll is clearly visible -->
    <section aria-hidden="true" style="height: 40vh;"></section>

    <section>
      <h2>Book your seat</h2>
      <form id="booking-form">
        <label>Match
          <select id="match">
            <option>Hawks vs Tigers</option>
            <option>Lions vs Wolves</option>
            <option>Eagles vs Bulls</option>
          </select>
        </label>
        <label>Your name
          <input id="name" type="text" autocomplete="name">
        </label>
        <button class="submit-btn" type="submit">Confirm booking</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
